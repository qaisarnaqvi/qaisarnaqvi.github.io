# Pages placed under these sections will be shown on homepage and archive page.
mainSections = ["post"]
# Output page's full content in RSS.
rssFullContent = true
favicon = "/favicon.png"

[footer]
since = 2025
customText = "Prof. Dr. Qaisar Abbas Naqvi"

[dateFormat]
published = "Jan 02, 2006"
lastUpdated = "Jan 02, 2006 15:04 MST"

[sidebar]
emoji = ""  # Removed the emoji for a professional look
subtitle = "Tenured Professor | Dept. of Electronics | Quaid-i-Azam University"

[sidebar.avatar]
enabled = true
local = true
src = "img/QA-NAQVI Profile Photo.jpeg" # Make sure you upload his photo to assets/img/avatar.jpg

[article]
headingAnchor = true
math = true  # ENABLED: Crucial for his Engineering/Physics formulas
readingTime = false # Disabled: CVs don't need "read time"

[article.license]
enabled = false # Disabled: Academic CVs usually don't need a CC license displayed

## Widgets
[[widgets.homepage]]
type = "search"

[[widgets.homepage]]
type = "archives"
[widgets.homepage.params]
limit = 5

# I commented these out so the sidebar isn't cluttered with blog categories. 
# If you want them back, just remove the '#' symbols.
# [[widgets.homepage]]
# type = "categories"
# [widgets.homepage.params]
# limit = 10

# [[widgets.homepage]]
# type = "tag-cloud"
# [widgets.homepage.params]
# limit = 10

[[widgets.page]]
type = "toc" # Table of Contents (Very useful for his long publication list)

[opengraph.twitter]
site = ""
card = "summary_large_image"

[defaultImage.opengraph]
enabled = false
local = false
src = ""

[colorScheme]
toggle = true
default = "auto"

[imageProcessing.cover]
enabled = true

[imageProcessing.content]
enabled = true

