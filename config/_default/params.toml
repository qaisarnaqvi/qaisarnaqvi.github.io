# --- Main Configuration ---
# Pages placed under these sections will be shown on homepage.
mainSections = ["post"]
rssFullContent = true
favicon = "/favicon.svg"

[footer]
    since = 2025
    customText = "Prof. Dr. Qaisar Abbas Naqvi"

[dateFormat]
    published = "Jan 02, 2006"
    lastUpdated = "Jan 02, 2006"

# --- SIDEBAR (Bio) ---
[sidebar]
    emoji = "" 
    # Updated to match his CV exactly
    subtitle = "Tenured Professor | Dept. of Electronics | Quaid-i-Azam University"

[sidebar.avatar]
    enabled = true
    local = true
    # RENAME your photo to 'avatar.jpeg' and put it in 'assets/img/' folder.
    # Spaces in filenames often cause errors in Hugo.
    src = "img/avatar.jpeg" 

# --- ARTICLE SETTINGS ---
[article]
    headingAnchor = true
    math = true          # ENABLED: Essential for his Physics/Math formulas
    readingTime = false  # Disabled for professional look

[article.license]
    enabled = false

## --- WIDGETS ---
# I have REMOVED the "Search" and "Archives" widgets here.
# This removes the right-most column entirely.

[[widgets.page]]
    type = "toc" # Keeps Table of Contents on Research/Teaching pages

# --- OTHERS ---
[opengraph.twitter]
    site = ""
    card = "summary_large_image"

[defaultImage.opengraph]
    enabled = false
    local = false
    src = ""

[colorScheme]
    toggle = false    # Hides the Moon/Sun switch
    default = "light" # Forces Light Mode

[imageProcessing.cover]
    enabled = true

[imageProcessing.content]
    enabled = true

## --- COMMENTS (Disabled) ---
[comments]
    enabled = false
    provider = "disqus"


# --- RESEARCH METRICS (Update these numbers manually) ---
[metrics]
    enable = true
    
    # Google Scholar
    [metrics.google]
        pubs = "285"
        cites = "4,254"
        h_index = "34"
        url = "https://scholar.google.com.pk/citations?user=G3jJymsAAAAJ&hl=en"

    # Web of Science
    [metrics.wos]
        pubs = "255"
        cites = "3,046"
        h_index = "29"
        # If you have a WOS profile link, put it here, else leave empty
        url = "#"

    # Ranking / Awards
    [metrics.ranking]
        text = "Ranked 7th in Physics"
        source = "Productive Scientists of Pakistan Directory (2017)"